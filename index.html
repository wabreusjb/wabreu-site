<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados 2024 por Município — Carla Machado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16305C;
    --navy-deep:#0D1F3D;
    --green:#2F8F4E;
    --gold:#E8AC1E;
    --gold-soft:#F7D774;
    --cream:#FBF8F1;
    --card:#FFFFFF;
    --ink:#1C1C1C;
    --ink-soft:#5B5B58;
    --line:rgba(22,48,92,0.12);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;display:block;}
  button{font-family:inherit;}

  /* ---------- HEADER ---------- */
  header.hero{
    position:relative;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;
    overflow:hidden;
  }
  header.hero::after{
    content:"";
    position:absolute; inset:0;
    background:
      radial-gradient(600px 300px at 15% -10%, rgba(232,172,30,0.25), transparent 60%),
      radial-gradient(500px 260px at 105% 10%, rgba(47,143,78,0.30), transparent 60%);
    pointer-events:none;
  }
  .hero-inner{
    position:relative;
    max-width:1080px;
    margin:0 auto;
    padding:22px 20px 26px;
    display:flex;
    align-items:center;
    gap:22px;
  }
  .hero-photo{
    width:76px; height:76px; border-radius:50%;
    overflow:hidden; flex-shrink:0;
    border:3px solid var(--gold-soft);
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  .hero-photo img{width:100%;height:100%;object-fit:cover; object-position: 50% 15%;}
  .hero-text .eyebrow{
    font-size:11.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--gold-soft); font-weight:600; margin-bottom:4px;
  }
  .hero-text h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(20px,4vw,28px);
    margin:0 0 3px; line-height:1.12;
  }
  .hero-text h1 span{color:var(--gold-soft); font-style:italic; font-weight:500;}
  .hero-text p{margin:0; font-size:13px; color:rgba(255,255,255,.78);}

  /* ---------- SEARCH / STATS BAR ---------- */
  .toolbar{
    max-width:1080px; margin:0 auto; padding:18px 20px 6px;
  }
  .stats-row{
    display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;
  }
  .stat-pill{
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:6px 14px; font-size:12.5px; color:var(--ink-soft); font-weight:600;
  }
  .stat-pill b{color:var(--navy); font-weight:800;}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); opacity:.45;}
  #search{
    width:100%; padding:13px 16px 13px 42px; border-radius:var(--radius);
    border:1.5px solid var(--line); background:var(--card); font-size:15px; color:var(--ink);
    outline:none; transition:border-color .15s;
  }
  #search:focus{border-color:var(--navy);}

  /* ---------- MUNICIPALITY LIST ---------- */
  main{max-width:1080px; margin:0 auto; padding:8px 20px 60px;}
  #muni-list{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
    gap:10px; margin-top:14px;
  }
  .muni-card{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; cursor:pointer; text-align:left;
    transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  .muni-card:hover{transform:translateY(-2px); box-shadow:0 8px 20px -10px rgba(22,48,92,.35); border-color:var(--navy);}
  .muni-card .name{font-weight:700; font-size:15px; color:var(--navy);}
  .muni-card .count{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .muni-card .arrow{color:var(--gold); font-size:18px; flex-shrink:0;}
  .letter-group{
    font-family:'Fraunces',serif; font-weight:600; font-size:13px; color:var(--green);
    margin:22px 2px 6px; letter-spacing:.06em; text-transform:uppercase;
  }
  .letter-group:first-of-type{margin-top:6px;}
  #empty-state{display:none; text-align:center; padding:50px 20px; color:var(--ink-soft);}

  /* ---------- DETAIL VIEW ---------- */
  #detail-view{display:none;}
  .back-btn{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--card); border:1.5px solid var(--line); border-radius:999px;
    padding:9px 16px 9px 12px; font-size:13.5px; font-weight:700; color:var(--navy);
    cursor:pointer; margin:16px 0 4px;
  }
  .back-btn:hover{border-color:var(--navy);}
  .detail-head{margin:14px 0 20px;}
  .detail-head h2{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(24px,5vw,32px);
    color:var(--navy); margin:0 0 6px;
  }
  .detail-head .sub{font-size:13.5px; color:var(--ink-soft);}
  .detail-head .sub b{color:var(--green); font-weight:800;}

  .cand-row{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:8px; position:relative; overflow:hidden;
  }
  .cand-rank{
    width:26px; flex-shrink:0; text-align:center; font-weight:800; font-size:12.5px;
    color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }
  .cand-rank.top3{color:var(--gold); font-size:14px;}
  .cand-main{flex:1; min-width:0; position:relative; z-index:1;}
  .cand-name{font-weight:700; font-size:14.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cand-party{
    display:inline-block; margin-top:3px; font-size:10.5px; font-weight:700;
    letter-spacing:.03em; color:var(--navy); background:rgba(22,48,92,0.08);
    padding:2px 8px; border-radius:5px;
  }
  .cand-bar-track{
    position:absolute; left:0; bottom:0; top:0; background:linear-gradient(90deg, rgba(47,143,78,0.10), rgba(47,143,78,0.03));
    z-index:0; border-radius:var(--radius);
  }
  .cand-votes{text-align:right; flex-shrink:0; z-index:1;}
  .cand-votes .n{font-weight:800; font-size:15px; color:var(--navy); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .cand-votes .pct{font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--navy-deep); color:rgba(255,255,255,.85);
    padding:22px 20px; margin-top:20px;
  }
  .footer-inner{max-width:1080px; margin:0 auto; display:flex; flex-wrap:wrap; gap:14px 26px; align-items:center; justify-content:space-between;}
  .footer-brand{font-family:'Fraunces',serif; font-size:15px; font-weight:600;}
  .footer-brand span{color:var(--gold-soft);}
  .footer-links{display:flex; flex-wrap:wrap; gap:16px; font-size:12.5px;}
  .footer-links a{color:rgba(255,255,255,.85); text-decoration:none; display:inline-flex; align-items:center; gap:6px;}
  .footer-links a:hover{color:var(--gold-soft);}

  @media (max-width:560px){
    .hero-inner{gap:14px; padding:18px 16px 22px;}
    .hero-photo{width:60px;height:60px;}
    #muni-list{grid-template-columns:1fr;}
    main{padding:8px 14px 50px;}
    .toolbar{padding:16px 14px 4px;}
  }
</style>
</head>

<script>
let DATA = {};
let currentList = [];

function fmtInt(n){ return n.toLocaleString('pt-BR'); }

function letterOf(name){
  const c = name.normalize('NFD').replace(/[\u0300-\u036f]/g,'')[0].toUpperCase();
  return c;
}

function renderList(filter){
  const listEl = document.getElementById('muni-list');
  const emptyEl = document.getElementById('empty-state');
  const names = Object.keys(DATA).sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const f = (filter||'').trim().toLowerCase();
  const filtered = f ? names.filter(n => n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(f.normalize('NFD').replace(/[\u0300-\u036f]/g,''))) : names;

  listEl.innerHTML = '';
  if(filtered.length === 0){
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  let lastLetter = '';
  filtered.forEach(name => {
    if(!f){
      const l = letterOf(name);
      if(l !== lastLetter){
        const h = document.createElement('div');
        h.className = 'letter-group';
        h.textContent = l;
        listEl.appendChild(h);
        lastLetter = l;
      }
    }
    const card = document.createElement('button');
    card.className = 'muni-card';
    card.innerHTML = `<div><div class="name">${name}</div><div class="count">${DATA[name].length} candidatos</div></div><span class="arrow">→</span>`;
    card.addEventListener('click', () => showDetail(name));
    listEl.appendChild(card);
  });

  if(f){
    listEl.style.gridTemplateColumns = 'repeat(auto-fill, minmax(240px,1fr))';
  }
}

function showDetail(name){
  const cands = DATA[name];
  document.getElementById('detail-title').textContent = name;
  document.getElementById('detail-count').textContent = cands.length;
  const wrap = document.getElementById('cand-list');
  wrap.innerHTML = '';
  const maxVotes = cands[0] ? cands[0].votos : 1;
  cands.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'cand-row';
    const barPct = Math.max(3, (c.votos / maxVotes) * 100);
    row.innerHTML = `
      <div class="cand-bar-track" style="width:${barPct}%"></div>
      <div class="cand-rank ${i<3?'top3':''}">${i+1}º</div>
      <div class="cand-main">
        <div class="cand-name">${c.nome}</div>
        <span class="cand-party">${c.partido}</span>
      </div>
      <div class="cand-votes">
        <div class="n">${fmtInt(c.votos)}</div>
        <div class="pct">${c.percentual}%</div>
      </div>`;
    wrap.appendChild(row);
  });
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  window.scrollTo({top:0, behavior:'instant'});
}

function showList(){
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  window.scrollTo({top:0, behavior:'instant'});
}

document.getElementById('back-btn').addEventListener('click', showList);
document.getElementById('search').addEventListener('input', (e) => renderList(e.target.value));
